# GitHub'Ä±n zamanlayÄ±cÄ±sÄ± en sÄ±k 5 dakikada bir tetikler ve yoÄŸunlukta geciktirir;
# bu yÃ¼zden iÅŸ SAAT BAÅI baÅŸlar ve kendi iÃ§inde 55 tur Ã— 60 saniye dÃ¶ner.
# Yani pratikte dakikada bir veri akar, ay boyunca kesintisiz.
#
