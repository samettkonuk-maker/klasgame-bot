name: Klasgame GB kuru

# DAKÄ°KADA BÄ°R Ã‡EKÄ°M
# GitHub'Ä±n zamanlayÄ±cÄ±sÄ± en sÄ±k 5 dakikada bir tetikler ve yoÄŸunlukta geciktirir;
# bu yÃ¼zden iÅŸ SAAT BAÅžI baÅŸlar ve kendi iÃ§inde 55 tur Ã— 60 saniye dÃ¶ner.
# Yani pratikte dakikada bir veri akar.
#
# DAKÄ°KA MALÄ°YETÄ°: bu ÅŸekilde ayda ~44.000 dakika eder. Private repoda Ã¼cretsiz
# kota 2000 dakikadÄ±r â†’ repoyu PUBLIC yap, public repolarda Actions SINIRSIZ.
on:
  schedule:
    - cron: '*/55 * * * *'
  workflow_dispatch:

concurrency:
  group: klasgame
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 62

    steps:
      - uses: actions/checkout@v4

      # Kurulum hatalarÄ±nÄ± erken ve ANLAÅžILIR biÃ§imde yakala.
      - name: Kontrol
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          echo "== Dosyalar =="
          ls -la
          test -f fetch.js      || { echo "HATA: fetch.js repoda yok."; exit 1; }
          test -f package.json  || { echo "HATA: package.json repoda yok."; exit 1; }

          echo "== Secrets =="
          if [ -z "$SITE_URL" ]; then
            echo "HATA: SITE_URL secret'Ä± tanÄ±mlÄ± deÄŸil."
            echo "  Settings â†’ Secrets and variables â†’ Actions â†’ New repository secret"
            echo "  Name: SITE_URL   Secret: https://ko4merc.com"
            exit 1
          fi
          if [ -z "$INGEST_KEY" ]; then
            echo "HATA: INGEST_KEY secret'Ä± tanÄ±mlÄ± deÄŸil."
            echo "  Admin â†’ Ayarlar â†’ Klasgame CanlÄ± Takip â†’ 'TarayÄ±cÄ± eklentisi anahtarÄ±'"
            exit 1
          fi
          echo "SITE_URL   : tanÄ±mlÄ± (${#SITE_URL} karakter)"
          echo "INGEST_KEY : tanÄ±mlÄ± (${#INGEST_KEY} karakter)"

          echo "== Site eriÅŸimi =="
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE_URL/api/gb-rate" \
                 -H 'Content-Type: application/json' -d '{"key":"kontrol","products":[]}')
          echo "POST $SITE_URL/api/gb-rate â†’ HTTP $code"
          case "$code" in
            403) echo "  (403 beklenen: uÃ§ nokta ayakta, anahtar kontrolÃ¼ Ã§alÄ±ÅŸÄ±yor)" ;;
            000) echo "HATA: siteye hiÃ§ ulaÅŸÄ±lamadÄ± â€” SITE_URL yanlÄ±ÅŸ olabilir."; exit 1 ;;
            404) echo "HATA: /api/gb-rate bulunamadÄ± â€” sitede gÃ¼ncelleme eksik olabilir."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright kur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Kuru Ã§ek ve siteye gÃ¶nder (dÃ¶ngÃ¼)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          LOOP_COUNT: ${{ vars.LOOP_COUNT || '55' }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '60' }}
          HUB_URL: ${{ vars.HUB_URL }}
          SELL_URL: ${{ vars.SELL_URL }}
        run: node fetch.js
