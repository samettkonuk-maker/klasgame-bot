on:
  schedule:
    - cron: '*/55 * * * *'
  workflow_dispatch:

concurrency:
  group: klasgame
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 62

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright kur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Kuru Ã§ek ve siteye gÃ¶nder (dÃ¶ngÃ¼)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          # DeÄŸiÅŸtirmek istersen: Settings â†’ Secrets and variables â†’ Actions â†’ Variables
          LOOP_COUNT: ${{ vars.LOOP_COUNT || '55' }}
          LOOP_SECONDS: ${{ vars.LOOP_SECONDS || '60' }}
          HUB_URL: ${{ vars.HUB_URL }}
          SELL_URL: ${{ vars.SELL_URL }}
        run: node fetch.js
